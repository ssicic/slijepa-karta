name: CI/CD

# Every push and pull request: check the code and data, build the Android app.
# Push to main: publish the website (only if the checks pass).
# Tag like v1.2.0: also attach the APK to a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript parses
        run: for f in www/*.js scripts/*.mjs tests/*.mjs; do node --check "$f"; done
      - name: Data checks
        run: node --test tests/
      - name: No AI tool mentions in the repo
        run: |
          if git grep -nIiE 'cl[a]ude|anthr[o]pic' -- . ':!package-lock.json'; then
            echo "::error::Found a mention above; remove it before merging."
            exit 1
          fi

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk SlijepaKarta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SlijepaKarta-apk
          path: SlijepaKarta.apk
          retention-days: 30

  deploy-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SlijepaKarta-apk
      - name: Create release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" SlijepaKarta.apk --repo "${{ github.repository }}" --title "Slijepa karta ${{ github.ref_name }}" --generate-notes
