<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f3ead3">
  <title>Slijepa karta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home" class="screen">
    <div class="eyebrow">Republika Hrvatska</div>
    <h1>Slijepa karta</h1>
    <p class="sub">Gradovi, rijeke, planine, parkovi i otoci. Bez ijednog natpisa.</p>
    <div class="rule"></div>
    <button id="main-game" class="hero"><small>Glavna igra</small><span id="main-game-label">Sve razine zaredom →</span></button>
    <h2>Vježba po razinama</h2>
    <button id="campaign"></button>
    <ul id="levels"></ul>
    <button id="open-scores" class="link-row">Ljestvica <span>→</span></button>
    <p class="colophon">Podaci o karti: Natural Earth i © suradnici OpenStreetMapa (ODbL). Za prolaz razine treba 50 %.</p>
  </main>

  <main id="game" class="screen hidden">
    <header class="bar">
      <button id="quit" aria-label="Natrag">←</button>
      <div class="prompt">
        <div id="progress"></div>
        <div id="question"></div>
      </div>
      <div id="score" class="score"></div>
    </header>
    <div class="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="scalebar"><div class="line" id="scale-line"></div><div class="labels"><span>0</span><span id="scale-km"></span></div></div>
      <button id="reset-view" class="hidden">Cijela karta</button>
      <footer id="feedback" class="bar hidden">
        <div id="feedback-text"></div>
        <button id="next" class="btn">Dalje</button>
      </footer>
    </div>
  </main>

  <main id="scores" class="screen hidden">
    <button id="scores-back" class="back">← Natrag</button>
    <div class="eyebrow">Glavna igra</div>
    <h1>Ljestvica</h1>
    <div class="rule"></div>
    <section id="online-section">
      <h2>Svi igrači</h2>
      <p id="online-status" class="hint"></p>
      <ol id="online-scores" class="scorelist"></ol>
    </section>
    <h2>Na ovom uređaju</h2>
    <ol id="highscores" class="scorelist"></ol>
  </main>

  <main id="result" class="screen hidden">
    <div id="result-level" class="eyebrow"></div>
    <div id="result-score"></div>
    <div id="result-stamp" class="stamp"></div>
    <p id="result-text" class="sub"></p>
    <form id="submit-score" class="hidden" autocomplete="off">
      <label for="nickname">Upiši se na ljestvicu</label>
      <div class="row">
        <input id="nickname" maxlength="16" placeholder="Nadimak" enterkeyhint="send">
        <button id="submit-btn" class="btn" type="submit">Spremi</button>
      </div>
      <p id="submit-msg" class="hint"></p>
    </form>
    <button id="result-next" class="btn"></button>
    <button id="result-retry" class="btn-outline"></button>
    <button id="result-home">Natrag na sadržaj</button>
  </main>

  <script src="config.js"></script>
  <script src="leaderboard.js"></script>
  <script src="data.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
